<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰 - 원진이 채팅방</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }
        /* 갤럭시 스타일 스마트폰 프레임 (반응형 외곽 틀) */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 720px; 
            background-color: #b2c7da; /* 카카오톡 기본 채팅방 배경색 일치 */
            position: relative;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 모바일 기기(화면 폭 450px 이하) 특수 규칙 */
        @media (max-width: 450px) {
            .phone-frame {
                border: none;
                border-radius: 0;
                height: 90dvh; 
                max-height: 90dvh; 
            }
        }
        /* 상단 상태 바 */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
            color: #000000;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid #000000;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
            justify-content: flex-start;
        }
        .battery-level {
            width: 81%;
            height: 100%;
            background-color: #000000;
            border-radius: 1px;
        }
        .battery-tip {
            width: 2px;
            height: 4px;
            background-color: #000000;
            position: absolute;
            right: -3px;
            border-radius: 0 1px 1px 0;
        }
        /* 카카오톡 채팅방 헤더 */
        .chat-header {
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: #000000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .back-btn {
            font-size: 20px;
            font-weight: normal;
        }
        .header-right {
            font-size: 20px;
            cursor: pointer;
        }
        /* 채팅방 스크롤 내부 영역 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }
        /* 중앙 날짜 구분선 스타일 */
        .date-divider {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .date-box {
            background-color: rgba(0, 0, 0, 0.15);
            color: #ffffff;
            font-size: 11px;
            padding: 5px 14px;
            border-radius: 12px;
        }
        /* 말풍선 기본 구조 */
        .message-row {
            display: flex;
            max-width: 85%;
        }
        /* 상대방(원진이) 대화 레이아웃 */
        .message-row.other {
            align-self: flex-start;
        }
        .chat-profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #7a6e9b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .chat-content-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-name {
            font-size: 12px;
            color: #555555;
        }
        .bubble-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 5px;
        }
        .bubble {
            background-color: #ffffff;
            color: #000000;
            padding: 8px 12px;
            border-radius: 0 12px 12px 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .chat-time {
            font-size: 10px;
            color: #777777;
            white-space: nowrap;
        }
        /* 나(노란 말풍선) 대화 레이아웃 */
        .message-row.me {
            align-self: flex-end;
            justify-content: flex-end;
        }
        .message-row.me .bubble {
            background-color: #fee500;
            border-radius: 12px 0 12px 12px;
        }
        /* 하단 가상 시스템 내비게이션 바 */
        .system-nav-bar {
            height: 48px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: #000000;
            font-size: 18px;
            border-top: 1px solid #f2f2f2;
        }
        .nav-key {
            cursor: pointer;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
