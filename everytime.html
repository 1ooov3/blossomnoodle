  board: function (b) { S.b = b; S.v = 'board'; render(); },
  open: function (id) { S.pid = id; S.v = 'post'; S.sel = []; S.rt = null; S.cx = ''; render(); },
  newPost: function () { S.dr = { title: '', body: '', img: [], poll: null }; S.v = 'write'; render(); },
  cam: function () { if (S.dr.img.length >= 2) return toast('사진은 최대 2장까지 넣을 수 있어요.'); fi.click(); },
  rmImg: function (i) { S.dr.img.splice(+i, 1); render(true); },
  editPoll: function () { var p = S.dr.poll; S.pd = p ? { o: p.o.slice(), m: p.m } : { o: ['', ''], m: false }; S.v = 'poll'; render(); },
  rmPoll: function () { S.dr.poll = null; render(true); },
  addOpt: function () { S.pd.o.push(''); render(true); },
  tgMulti: function () { S.pd.m = !S.pd.m; render(true); },
  pollDone: function () {
    if (!pollOk()) return;
    S.dr.poll = { o: S.pd.o.map(function (x) { return x.trim(); }).filter(Boolean), m: S.pd.m ? 1 : 0 };
    S.v = 'write'; render();
  },
  submit: async function () {
    if (!canPost()) return;
    var d = S.dr, id = 'p' + Date.now(), p = { t: Date.now(), title: d.title.trim(), body: d.body.trim(), by: S.u, d: stamp() };
    if (d.img.length) p.img = d.img.slice();
    if (d.poll) p.poll = { o: d.poll.o.slice(), m: d.poll.m };
    var saved = await Store.set('posts/' + S.b + '/' + id, p);
    if (saved === false) return;
    S.v = 'board'; render();
  },
  like: async function () {
    var p = P(); if (p.l && p.l[S.u]) return toast('이미 공감한 글입니다.');
    await Store.set(pp() + '/l/' + S.u, 1); render(true);
  },
  pick: function (i) {
    i = +i; var m = P().poll.m, k = S.sel.indexOf(i);
    if (m) { if (k > -1) S.sel.splice(k, 1); else S.sel.push(i); } else S.sel = [i];
    render(true);
  },
  vote: async function () {
    if (!S.sel.length) return;
    await Store.set(pp() + '/poll/v/' + S.u, S.sel.slice().sort().join(',')); S.sel = []; render(true);
  },
  reply: function (cid) { var c = P().c[cid]; S.rt = c.p || cid; render(true); var i = $('#ci'); if (i) i.focus(); },
  cancelRt: function () { S.rt = null; render(true); },
  send: async function () {
    var x = S.cx.trim(); if (!x) return;
    var id = 'c' + Date.now() + Math.floor(Math.random() * 1000), c = { t: Date.now(), u: S.u, x: x, d: stamp() };
    if (S.rt) c.p = S.rt;
    S.cx = ''; S.rt = null;
    await Store.set(pp() + '/c/' + id, c); render(true);
    var sc = $('.sc'); if (sc) sc.scrollTop = sc.scrollHeight;
  },
  more: function (x) {
    if (!isAdmin()) return;
    if (x === 'p') ask(async function () { await Store.set(pp(), null); S.v = 'board'; render(); });
    else ask(async function () {
      var cs = P().c || {};
      for (var k in cs) if (k === x || cs[k].p === x) await Store.set(pp() + '/c/' + k, null);
      render(true);
    });
  }
};

$app.addEventListener('click', function (ev) {
  var e = ev.target.closest('[data-a]'); if (!e || !A[e.dataset.a]) return;
  A[e.dataset.a](e.dataset.x);
});
$app.addEventListener('input', function (ev) {
  var t = ev.target, dn = $('#dn');
  if (t.id === 'ti') S.dr.title = t.value;
  else if (t.id === 'bo') S.dr.body = t.value;
  else if (t.id === 'ci') S.cx = t.value;
  else if (t.dataset.i != null) S.pd.o[+t.dataset.i] = t.value;
  else return;
  if (dn) dn.className = 'dn' + ((S.v === 'write' ? canPost() : pollOk()) ? ' on' : '');
});
$app.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'pw') A[S.v === 'sign' ? 'signup' : 'login']();
  else if (ev.target.id === 'ci') A.send();
});

/* 공유 저장소 사용 시 주기적으로 새 글 불러오기 (화면을 보고 있을 때만, 30초마다) */
if (FIREBASE_URL) {
  setInterval(async function () {
    if (document.hidden || ['home', 'board', 'post', 'shop'].indexOf(S.v) < 0) return;
    var a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    var before = JSON.stringify(T);
    try { await Store.load(); } catch (e) { return; }
    if (JSON.stringify(T) !== before) render(true);
  }, 30000);
}

(async function () {
  var ok = true;
  try { await Store.load(); } catch (e) { ok = false; toast('서버에 연결할 수 없습니다.'); }
  if (ok && !T.seeded) { try { await Store.seed(); } catch (e) { toast('초기 데이터를 만들지 못했습니다.'); } }
  render();
})();
</script>
</body>
</html>
