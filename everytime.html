<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에브리타임</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; overflow: hidden; }

/* ===== 스마트폰 프레임 (기존 초기설정과 동일) ===== */
.phone-frame { width: 100%; max-width: 412px; height: 720px; background-color: #000000; position: relative; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); border: 12px solid #2d2d2d; display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 450px) { .phone-frame { border: none; border-radius: 0; height: 90dvh; max-height: 90dvh; } }
.status-bar { height: 40px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 500; z-index: 10; }
.status-right { display: flex; align-items: center; gap: 6px; }
.battery-icon { width: 22px; height: 12px; border: 1px solid #fff; border-radius: 3px; position: relative; display: flex; align-items: center; padding: 1px; }
.battery-level { width: 81%; height: 100%; background-color: #fff; border-radius: 1px; }
.battery-tip { width: 2px; height: 4px; background-color: #fff; position: absolute; right: -3px; border-radius: 0 1px 1px 0; }

/* ===== 앱 화면 ===== */
.screen { flex: 1; min-height: 0; position: relative; background: #fff; color: #222; display: flex; flex-direction: column; overflow: hidden; }
.screen svg { width: 22px; height: 22px; stroke: #222; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sc { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.sc::-webkit-scrollbar { display: none; }
button { font: inherit; color: inherit; }
input, textarea { font: inherit; outline: none; border: 0; background: none; color: #222; width: 100%; }
hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }

.hd { display: flex; align-items: center; gap: 2px; padding: 6px 8px 8px; flex-shrink: 0; }
.hd .t { flex: 1; min-width: 0; padding-left: 6px; }
.hd .t b { display: block; font-size: 16px; }
.hd .t small { font-size: 11px; color: #999; }
.ib { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; background: none; cursor: pointer; flex-shrink: 0; }
.ib.dim svg { stroke: #ccc; }

/* 로그인 */
.cen { display: flex; flex-direction: column; justify-content: center; padding: 0 34px; text-align: center; }
.cen h2 { font-size: 24px; margin-top: 8px; }
.cen .sch { color: #888; font-size: 13px; margin: 4px 0 28px; }
.cen input { background: #f5f5f5; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; font-size: 15px; }
.rb { width: 100%; background: #f5261a; color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
.lk { background: none; border: 0; color: #777; font-size: 13px; margin-top: 16px; cursor: pointer; text-decoration: underline; }
.msg { min-height: 20px; font-size: 12.5px; color: #f5261a; margin: 2px 0; }
.msg.ok { color: #0a9; }
.note { font-size: 11.5px; color: #999; margin: 4px 0 6px; line-height: 1.5; }

/* 홈 */
.hm { padding: 4px 16px 20px; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.sn { font-size: 22px; font-weight: 800; margin: 6px 0 14px; }
.cards { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
