<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰 - 형준이 채팅방</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }
        /* 갤럭시 스타일 스마트폰 프레임 (반응형 외곽 틀) */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 720px; 
            background-color: #b2c7da; /* 카카오톡 기본 채팅방 배경색 */
            position: relative;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 모바일 기기(화면 폭 450px 이하)로 접속했을 때만 작동하는 특수 규칙 */
        @media (max-width: 450px) {
            .phone-frame {
                border: none;
                border-radius: 0;
                height: 90dvh; 
                max-height: 90dvh; 
            }
        }
        /* 상단 상태 바 (배터리 및 시간 표시 영역) */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
            color: #000000; /* 채팅방 밝은 배경에 맞추어 검은색 적용 */
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* 배터리 아이콘 모양 시각화 */
        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid #000000;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
            justify-content: flex-start;
        }
        .battery-level {
            width: 81%;
            height: 100%;
            background-color: #000000;
            border-radius: 1px;
        }
        .battery-tip {
            width: 2px;
            height: 4px;
            background-color: #000000;
            position: absolute;
            right: -3px;
            border-radius: 0 1px 1px 0;
        }

        /* 카카오톡 채팅방 헤더 (뒤로가기, 이름, 메뉴) */
        .chat-header {
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: #000000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .back-btn {
            font-size: 20px;
            font-weight: normal;
        }
        .header-right {
            font-size: 20px;
            cursor: pointer;
        }

        /* 채팅방 스크롤 내부 영역 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }

        /* 중앙 날짜 구분선 스타일 */
        .date-divider {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .date-box {
            background-color: rgba(0, 0, 0, 0.15);
            color: #ffffff;
            font-size: 11px;
            padding: 5px 14px;
            border-radius: 12px;
        }

        /* 말풍선 기본 구조 */
        .message-row {
            display: flex;
            max-width: 85%;
        }

        /* 상대방(형준이) 대화 레이아웃 */
        .message-row.other {
            align-self: flex-start;
        }
        .chat-profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #7a6e9b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .chat-content-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-name {
            font-size: 12px;
            color: #555555;
        }
        .bubble-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 5px;
        }
        .bubble {
            background-color: #ffffff;
            color: #000000;
            padding: 8px 12px;
            border-radius: 0 12px 12px 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .chat-time {
            font-size: 10px;
            color: #777777;
            white-space: nowrap;
        }

        /* 나(노란 말풍선) 대화 레이아웃 */
        .message-row.me {
            align-self: flex-end;
            justify-content: flex-end;
        }
        .message-row.me .bubble {
            background-color: #fee500; /* 카카오톡 고유 노란색 */
            border-radius: 12px 0 12px 12px;
        }

        /* 하단 메시지 입력창 */
        .input-bar {
            background-color: #ffffff;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-box {
            flex: 1;
            background-color: #f2f2f2;
            border: 1px solid #e2e2e2;
            border-radius: 18px;
            padding: 8px 14px;
            font-size: 14px;
            color: #aaaaaa;
        }
        .send-btn {
            background-color: #fee500;
            color: #000000;
            font-size: 12px;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 16px;
            cursor: pointer;
        }

        /* 스마트폰 하단 가상 시스템 내비게이션 바 */
        .system-nav-bar {
            height: 48px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: #000000;
            font-size: 18px;
            border-top: 1px solid #f2f2f2;
        }
        .nav-key {
            cursor: pointer;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <!-- 갤럭시 스타일 스마트폰 프레임 -->
    <div class="phone-frame">
        
        <!-- 상단 상태 바 -->
        <div class="status-bar">
            <span class="status-time">오후 5:02</span>
            <div class="status-right">
                <span>81%</span>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                    <div class="battery-tip"></div>
                </div>
            </div>
        </div>

        <!-- 카카오톡 상단 헤더 메뉴 (클릭 시 카톡 메인 목록인 home.html로 돌아가도록 세팅) -->
        <header class="chat-header">
            <div class="header-left" onclick="location.href='home.html'">
                <span class="back-btn">〈</span>
                <span>형준이</span>
            </div>
            <div class="header-right">
                <span>⋮</span>
            </div>
        </header>

        <!-- 채팅 메시지 스크롤 영역 -->
        <main class="chat-container">
            
            <!-- 날짜 구분선 -->
            <div class="date-divider">
                <div class="date-box">2026년 10월 3일 토요일</div>
            </div>

            <!-- 1. 나 : 형준아 혹시 성민이 어딨는지 알아? -->
            <div class="message-row me">
                <div class="bubble-wrapper">
                    <span class="chat-time">오후 4:14</span>
                    <div class="bubble">형준아 혹시 성민이 어딨는지 알아?</div>
                </div>
            </div>

            <!-- 2. 형준이 : 형 또 성민이한테 혼났어? -->
            <div class="message-row other">
                <div class="chat-profile">👤</div>
                <div class="chat-content-box">
                    <span class="chat-name">형준이</span>
                    <div class="bubble-wrapper">
                        <div class="bubble">형 또 성민이한테 혼났어?</div>
                        <span class="chat-time">오후 4:16</span>
                    </div>
                </div>
            </div>

            <!-- 3. 형준이 : 아까 카페간다던데 -->
            <div class="message-row other">
                <!-- 연속 대화의 경우 프로필과 이름은 생략되도록 연출 가능하지만 기본 구조 유지를 위해 세팅 -->
                <div class="chat-profile">👤</div>
                <div class="chat-content-box">
                    <span class="chat-name">형준이</span>
                    <div class="bubble-wrapper">
                        <div class="bubble">아까 카페간다던데</div>
                        <span class="chat-time">오후 4:16</span>
                    </div>
                </div>
            </div>

            <!-- 4. 나 : 매일가는 거기 맞지 -->
            <div class="message-row me">
                <div class="bubble-wrapper">
                    <span class="chat-time">오후 4:17</span>
                    <div class="bubble">매일가는 거기 맞지</div>
                </div>
            </div>

            <!-- 5. 나 : 고마워ㅎㅎ -->
            <div class="message-row me">
                <div class="bubble-wrapper">
                    <span class="chat-time">오후 4:17</span>
                    <div class="bubble">고마워ㅎㅎ</div>
                </div>
            </div>

        </main>

        <!-- 하단 메시지 폼 -->
        <div class="input-bar">
