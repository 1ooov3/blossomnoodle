<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤럭시 스타일 스마트폰</title>
    <style>
        :root {
            --phone-bg-color: #000000;
            --main-text-color: #ffffff;
            --sub-text-color: #e0e0e0;
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SamsungOne', 'Pretendard', -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121315;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--main-text-color);
        }

        /* 📱 갤럭시 프리미엄 스타일 외부 프레임 */
        .phone-frame {
            width: 380px;
            height: 820px;
            background-color: var(--phone-bg-color);
            border: 8px solid #2d3034;
            border-radius: 46px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 전면 카메라 펀치홀 */
        .punch-hole {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background-color: #000000;
            border-radius: 50%;
            z-index: 100;
        }

        /* 상단 인디케이터 바 */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 38px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px 0;
            font-size: 13px;
            font-weight: 500;
            z-index: 90;
            background: transparent;
        }
        .status-bar .r {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 화면 공통 규격 */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .screen.active {
            display: flex;
        }

        /* ----------------------------------
           [화면 1] 잠금화면 스킨 (요청 사진 기반)
        ----------------------------------- */
        #lock-screen {
            /* 보내주신 푸른 하늘 배경 이미지 적용 */
            background: url('https://unsplash.com') center/cover no-repeat;
            padding-top: 75px;
            align-items: center;
            cursor: pointer;
        }
        .clock-widget {
            text-align: center;
        }
        .time-text {
            font-size: 56px;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .date-text {
            font-size: 16px;
            font-weight: 400;
            color: var(--sub-text-color);
            margin-top: 8px;
        }

        /* 카카오톡 메시지 알림바 */
        .noti-box {
            width: calc(100% - 32px);
            margin-top: 40px;
            z-index: 10;
        }
        .kakao-noti {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: background 0.2s;
        }
        .kakao-noti:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .kakao-icon-wrapper {
            width: 38px;
            height: 38px;
            background-color: #fef01b;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #3a1d1d;
            font-weight: bold;
        }
        .noti-info {
            flex: 1;
        }
        .noti-sender {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .noti-msg {
            font-size: 13px;
            color: var(--sub-text-color);
        }

        /* 하단 고정 요소 (통화, 카메라, 가이드라인) */
        .lock-footer {
            position: absolute;
            bottom: 45px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
        }
        .footer-app-btn {
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .guide-text {
            font-size: 13px;
            color: var(--sub-text-color);
            font-weight: 400;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* ----------------------------------
           [화면 2] PIN 암호 입력 화면
        ----------------------------------- */
        #pin-screen {
            background: rgba(0, 0, 0, 0.88);
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .pin-container {
            text-align: center;
            margin-bottom: 35px;
        }
        .pin-instruction {
            font-size: 16px;
            color: var(--main-text-color);
            margin-bottom: 24px;
            height: 22px;
            transition: color 0.1s;
        }
        .indicator-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .indicator-dot {
            width: 12px;
            height: 12px;
            border: 2px solid var(--main-text-color);
            border-radius: 50%;
            transition: background 0.1s;
        }
        .indicator-dot.active {
            background-color: var(--main-text-color);
        }

        /* 다이얼 키패드 규격 */
        .numeric-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px 24px;
            width: 250px;
        }
        .num-key {
            width: 66px;
            height: 66px;
            background: #161719;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--main-text-color);
            cursor: pointer;
        }
        .num-key:active {
            background: #25282c;
        }

        /* 틀렸을 때 발생하는 진동 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ----------------------------------
           [화면 3] 갤럭시 홈 화면 (대기 구역)
        ----------------------------------- */
        #home-screen {
            background-color: #121315;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .fallback-box {
            text-align: center;
            background: #161719;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            cursor: pointer;
        }
        .fallback-box h2 { font-size: 18px; margin-bottom: 8px; color: #4cd137; }

        /* ----------------------------------
           [화면 4] 카카오톡 채팅방 구역 (대기 구역)
        ----------------------------------- */
        #talk-screen {
            background-color: #1a1a1a;
            padding-top: 38px;
        }
        .talk-header {
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #2d2d2d;
        }
        .back-btn { margin-right: 15px; cursor: pointer; font-size: 18px; }
        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-bubble {
            background-color: #2a2a2a;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            align-self: flex-start;
        }
    </style>
</head>
<body onclick="handleGlobalClick(event)">

        <div class="punch-hole"></div>
        
        <!-- 최상단 상태 인디케이터 바 -->
        <div class="status-bar">
            <span>5:02</span>
            <div class="r">
                <span>LTE</span>
                <span style="font-size:11px; margin-left:2px;">📶</span>
                <span style="margin-left: 2px;">81%</span>
                <span style="font-size:14px; margin-left:1px;">🔋</span>
            </div>
        </div>

        <!-- [화면 1] 잠금화면 구역 -->
        <div class="screen active" id="lock-screen">
            <div class="clock-widget">
                <div class="time-text">5:02</div>
                <div class="date-text">10월 6일 화요일</div>

                <div class="kakao-noti" id="kakao-target" onclick="triggerUnlockPath('chat', event)">
                    <div class="kakao-icon-wrapper">톡</div>
                    <div class="noti-info">
                        <div class="noti-sender">덩이❤</div>
