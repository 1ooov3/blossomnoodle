<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }
        /* 갤럭시 스타일 스마트폰 프레임 (반응형 외곽 틀) */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            background-color: #000000; /* 아무 무늬 없는 검정 배경 */
            position: relative;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        @media (max-width: 450px) {
            .phone-frame {
                border: none;
                border-radius: 0;
                max-height: 100vh;
            }
        }
        /* 상단 상태 바 (배터리 및 시간 표시 영역) */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* 배터리 아이콘 모양 시각화 */
        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid #ffffff;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
        }
        .battery-level {
            width: 81%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 1px;
        }
        .battery-tip {
            width: 2px;
            height: 4px;
            background-color: #ffffff;
            position: absolute;
            right: -3px;
            border-radius: 0 1px 1px 0;
        }
        /* 중앙 시계 및 날짜 영역 */
        .lock-screen-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            z-index: 10;
        }
        .time {
            font-size: 64px;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        .date {
            font-size: 16px;
            font-weight: 400;
            color: #e0e0e0;
            margin-bottom: 24px;
        }
        /* 카카오톡 알림 미리보기 창 */
        .notification-card {
            width: 90%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        .kakao-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
        }
        .notification-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .noti-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sender-name {
            font-size: 15px;
            font-weight: 600;
        }
        .noti-time {
            font-size: 12px;
            color: #cccccc;
        }
        .noti-text {
            font-size: 14px;
            color: #e5e5e5;
        }
        /* 하단 잠금해제 안내 및 숏컷 아이콘 영역 */
        .lock-screen-bottom {
            padding-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .unlock-text {
            font-size: 15px;
            color: #e0e0e0;
            font-weight: 400;
            letter-spacing: -0.5px;
        }
        .bottom-action-bar {
            width: 100%;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        /* 제공된 사진 속 반투명 원형 아이콘 스타일 적용 */
        .action-button {
            width: 56px;
            height: 56px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-button:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }
        /* SVG 아이콘 스타일 */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <!-- 휴대폰 본체 프레임 -->

        <!-- 상단 바 -->

                    </svg>
                </div>
                
                <!-- 오른쪽 카메라 아이콘 (사진 참고) -->
                <div class="action-button" aria-label="카메라">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</body>
    <style>
    /* 1. 기존 화면을 유지하면서 동적으로 화면을 전환하기 위한 확장 스타일 */
    #lock-screen-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        transition: transform 0.4s ease, opacity 0.3s ease;
    }
    .phone-frame {
        position: relative;
        overflow: hidden;
    }
    
    /* 비밀번호 화면 스타일 */
    .pin-screen-layer {
        position: absolute;
        top: 40px; /* 상단바 제외 */
        left: 0;
        width: 100%;
        height: calc(100% - 40px);
        background-color: #000000;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 40px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.4s ease;
        transform: translateY(50px);
        z-index: 50;
    }
    .pin-screen-layer.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
    }
    .pin-header { text-align: center; margin-top: 60px; }
    .pin-title { font-size: 19px; font-weight: 400; margin-bottom: 24px; color: #ffffff; }
    .pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
    .pin-dot { width: 12px; height: 12px; border: 2px solid #ffffff; border-radius: 50%; transition: background 0.1s; }
    .pin-dot.filled { background-color: #ffffff; }
    .pin-error-msg { font-size: 14px; color: #ff4d4d; height: 20px; opacity: 0; transition: opacity 0.2s; }
    
    /* 키패드 배열 */
    .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 35px; width: 80%; max-width: 300px; }
    .pin-key { background: none; border: none; color: #ffffff; font-size: 28px; height: 64px; display: flex; justify-content: center; align-items: center; cursor: pointer; outline: none; }
    .pin-key:active { background-color: rgba(255, 255, 255, 0.1); border-radius: 50%; }
    .pin-key.text-btn { font-size: 14px; color: #cccccc; }

    /* 홈화면 스타일 */
    .home-screen-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #121212;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        z-index: 60;
    }
    .home-screen-layer.active { opacity: 1; pointer-events: auto; }

    /* 카카오톡 내부 대화방 스타일 */
    .chat-screen-layer {
        position: absolute;
        top: 40px; left: 0; width: 100%; height: calc(100% - 40px);
        background-color: #bacee0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        z-index: 70;
    }
    .chat-screen-layer.active { opacity: 1; pointer-events: auto; }
    .chat-top-bar { background-color: #bacee0; padding: 14px 16px; display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 17px; color: #000000; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .chat-back-btn { font-size: 18px; cursor: pointer; }
    .chat-main-area { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .chat-date-badge { align-self: center; background-color: rgba(0, 0, 0, 0.1); color: #ffffff; padding: 4px 12px; border-radius: 12px; font-size: 11px; }
    .chat-msg-row { display: flex; gap: 8px; color: #000000; }
    .chat-user-img { width: 40px; height: 40px; border-radius: 15px; object-fit: cover; }
    .chat-msg-body { display: flex; flex-direction: column; gap: 4px; }
    .chat-user-name { font-size: 13px; color: #555555; font-weight: 500; }
    .chat-bubble-wrap { display: flex; align-items: flex-end; gap: 6px; }
    .chat-bubble-text { background-color: #ffffff; padding: 10px 12px; border-radius: 0 12px 12px 12px; font-size: 14.5px; max-width: 220px; line-height: 1.4; }
    .chat-timestamp { font-size: 10px; color: #666666; white-space: nowrap; }
</style>

<!-- 동적으로 주입될 기능 레이어들 -->
<div id="extended-layers">
    <!-- PIN 입력 레이어 -->
    <div id="custom-pin-screen" class="pin-screen-layer">
        <div class="pin-header">
            <div class="pin-title">PIN 번호를 입력하세요</div>
            <div class="pin-dots">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <div id="custom-error-msg" class="pin-error-msg">비밀번호가 올바르지 않습니다.</div>
        </div>
        <div class="pin-keypad">
            <button class="pin-key" onclick="extPressNum('1')">1</button>
            <button class="pin-key" onclick="extPressNum('2')">2</button>
            <button class="pin-key" onclick="extPressNum('3')">3</button>
            <button class="pin-key" onclick="extPressNum('4')">4</button>
            <button class="pin-key" onclick="extPressNum('5')">5</button>
            <button class="pin-key" onclick="extPressNum('6')">6</button>
            <button class="pin-key" onclick="extPressNum('7')">7</button>
            <button class="pin-key" onclick="extPressNum('8')">8</button>
            <button class="pin-key" onclick="extPressNum('9')">9</button>
            <button class="pin-key text-btn" onclick="extResetPin()">초기화</button>
            <button class="pin-key" onclick="extPressNum('0')">0</button>
            <button class="pin-key text-btn" onclick="extDeleteNum()">제거</button>
        </div>
    </div>

    <!-- 홈 화면 레이어 -->
    <div id="custom-home-screen" class="home-screen-layer">
        <h2 style="font-size: 24px; font-weight: 600; margin-bottom: 8px;">스마트폰 홈화면</h2>
        <p style="font-size: 14px; color: #aaaaaa;">성공적으로 잠금이 해제되었습니다.</p>
    </div>

    <!-- 카카오톡 내부 대화방 레이어 -->
    <div id="custom-chat-screen" class="chat-screen-layer">
        <div class="chat-top-bar">
            <span class="chat-back-btn" onclick="extBackToLock()">❮</span>
            <span>덩이❤</span>
        </div>
        <div class="chat-main-area">
            <div class="chat-date-badge">10월 6일 화요일</div>
            <div class="chat-msg-row">
                <img class="chat-user-img" src="https://gstatic.com" alt="프로필">
                <div class="chat-msg-body">
                    <div class="chat-user-name">덩이❤</div>
                    <div class="chat-bubble-wrap">
                        <div class="chat-bubble-text">형 나 수업끝났어</div>
                        <div class="chat-timestamp">오후 5:02</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 시스템 변수 및 타겟 요소 정의
    const CORRECT_PIN = "0801";
    let extInputStr = "";
    let extFlowTarget = "home"; // 'home' 또는 'chat' 분기

    // 구조 보존형 레이아웃 래핑 처리
    const frame = document.querySelector('.phone-frame');
    const layersWrap = document.getElementById('extended-layers');
    
    // 비밀번호, 홈, 채팅 레이어를 메인 프레임 안으로 안전하게 이동
    if(frame && layersWrap) {
        frame.appendChild(layersWrap);
    }

    // 기존 요소 식별 후 터치 이벤트 바인딩
    const notiCard = document.querySelector('.notification-card');
    const timeEl = document.querySelector('.time');
    const dateEl = document.querySelector('.date');
    const unlockTxt = document.querySelector('.unlock-text');
    const btmBar = document.querySelector('.bottom-action-bar');

    // 1. 어디를 클릭해도 비밀번호 입력창으로 전송되는 로직 빌드
    frame.style.cursor = 'pointer';
    frame.addEventListener('click', (e) => {
        // 하단 앱 단축 아이콘 영역 제외
        if(btmBar && btmBar.contains(e.target)) return;
        
        extFlowTarget = "home";
        extOpenPin();
    });

    // 2. 카카오톡 미리보기 알림창 전용 클릭 바인딩
    if(notiCard) {
        notiCard.addEventListener('click', (e) => {
            e.stopPropagation(); // 일반 화면 클릭으로 흐르는 중복 전송 차단
            extFlowTarget = "chat";
            extOpenPin();
        });
    }

    function extOpenPin() {
        document.getElementById('custom-pin-screen').classList.add('active');
        extResetPin();
    }

    function extPressNum(num) {
        if (extInputStr.length >= 4) return;
        extInputStr += num;
        document.getElementById('custom-error-msg').style.opacity = "0";
        extUpdateDots();

        if (extInputStr.length === 4) {
            setTimeout(extVerifyPin, 180);
        }
    }

    function extDeleteNum() {
        if (extInputStr.length > 0) {
            extInputStr = extInputStr.slice(0, -1);
            extUpdateDots();
        }
    }

    function extResetPin() {
        extInputStr = "";
        extUpdateDots();
        document.getElementById('custom-error-msg').style.opacity = "0";
    }

    function extUpdateDots() {
        const dotsList = document.querySelectorAll('.pin-dot');
        dotsList.forEach((dot, idx) => {
            if (idx < extInputStr.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        });
    }

    // 비밀번호 검증 처리 및 분기 실행
    function extVerifyPin() {
        if (extInputStr === CORRECT_PIN) {
            document.getElementById('custom-pin-screen').classList.remove('active');
            if (extFlowTarget === "chat") {
                document.getElementById('custom-chat-screen').classList.add('active');
            } else {
                document.getElementById('custom-home-screen').classList.add('active');
            }
        } else {
            document.getElementById('custom-error-msg').style.opacity = "1";
            extInputStr = "";
            extUpdateDots();
        }
    }

    // 카톡방에서 다시 원상복구 시키는 뒤로가기 제어함수
    function extBackToLock() {
