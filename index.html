<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
        <meta name="description" content="본문의 링크를 누르면 등장인물의 휴대폰을 열어볼 수 있는 페이지">
        <title>휴대폰 엿보기</title>
        <style>
            :root {
                --ink: #17191c;
                --muted: #777b82;
                --green: #03c75a
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                margin: 0;
                font-family: "Noto Sans KR",Roboto,Arial,sans-serif;
                background: #121315;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                overflow: hidden;
            }

            button,input {
                font: inherit
            }

            button {
                cursor: pointer;
                border: 0;
                background: none;
                color: inherit;
                padding: 0
            }

            /* 프리미엄 갤럭시 외형 프레임 구조 */
            .phone {
                position: relative;
                width: 380px;
                height: 820px;
                background: #000;
                overflow: hidden;
                border-radius: 46px;
                font-family: Roboto,"Noto Sans KR",Arial,sans-serif;
                color: var(--ink);
                line-height: 1.4;
                border: 8px solid #2d3034;
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
                display: flex;
                flex-direction: column;
            }

            /* 상단 바 및 펀치홀 구성 */
            .status {
                position: absolute;
                z-index: 90;
                top: 0;
                left: 0;
                width: 100%;
                height: 38px;
                padding: 14px 24px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 13px;
                font-weight: 500;
                color: #fff;
                pointer-events: none;
            }

            .status .r {
                display: flex;
                gap: 5px;
                align-items: center;
                font-size: 11px
            }

            .hole {
                position: absolute;
                z-index: 100;
                top: 12px;
                left: 50%;
                transform: translateX(-50%);
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #000;
            }

            .screen {
                position: absolute;
                inset: 0;
                overflow: hidden;
                display: none;
                flex-direction: column;
            }

            .screen.active {
                display: flex;
            }

            /* 🌌 [화면 1] 잠금화면 구역 (하늘 배경 매칭 및 레이아웃 오류 수정 완료) */
            .home-lock {
                /* 원본 소스의 구조를 살려 푸른 하늘 구름 이미지로 배경 교체 완료 */
                background: linear-gradient(rgba(10,20,40,0.05),rgba(10,20,40,0.15)), url('https://unsplash.com') center/cover no-repeat;
                color: #fff;
                padding: 75px 22px 0;
                align-items: center;
                cursor: pointer;
            }

            .widget {
                text-align: center;
            }

            .clock {
                font-size: 56px;
                font-weight: 300;
                letter-spacing: -1px;
                line-height: 1.05;
                color: #fff;
            }

            .clock-sub {
                font-size: 16px;
                margin-top: 8px;
                color: #e0e0e0;
            }

            /* 카카오톡 메시지 알림 바 규격 */
            .noti-box {
                width: calc(100% - 16px);
                margin-top: 40px;
                z-index: 10;
            }

            .kakao-noti {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 22px;
                padding: 14px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
                cursor: pointer;
                color: #fff;
                text-align: left;
            }

            /* 💬 요청하신 카카오톡 노란 사각형 안의 검은 말풍선 그림 추가 */
            .kakao-icon-wrapper {
                width: 38px;
                height: 38px;
                background-color: #fef01b;
                border-radius: 12px;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-shrink: 0;
            }

            .kakao-svg {
                width: 20px;
                height: 20px;
                fill: #3a1d1d;
            }

            .noti-info {
                flex: 1;
            }

            .noti-sender {
                font-size: 14px;
                font-weight: 600;
                margin-bottom: 2px;
            }

            .noti-msg {
                font-size: 13px;
                color: #e0e0e0;
            }

            /* 하단 고정 전화, 카메라 앱 셔틀 구조 */
            .lock-footer {
                position: absolute;
                bottom: 45px;
                width: calc(100% - 44px);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .footer-app-btn {
                width: 46px;
                height: 46px;
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(5px);
                -webkit-backdrop-filter: blur(5px);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .footer-app-btn svg {
                width: 20px;
                height: 20px;
                fill: #ffffff;
            }

            .guide-text {
                font-size: 13px;
                color: #e0e0e0;
                font-weight: 400;
                text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            }

            /* ----------------------------------
               [화면 2] PIN 암호 입력 화면
        ----------------------------------- */
            #pin-screen {
                background: rgba(0, 0, 0, 0.88);
                justify-content: center;
                align-items: center;
                padding: 40px 20px;
            }

            .pin-container {
                text-align: center;
                margin-bottom: 35px;
            }

            .pin-instruction {
                font-size: 16px;
                color: #fff;
                margin-bottom: 24px;
                height: 22px;
            }

            .indicator-dots {
                display: flex;
                justify-content: center;
                gap: 16px;
            }

            .indicator-dot {
                width: 12px;
                height: 12px;
                border: 2px solid #fff;
                border-radius: 50%;
                transition: background 0.1s;
            }

            .indicator-dot.active {
                background-color: #fff;
            }

            .numeric-keypad {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 16px 24px;
                width: 250px;
            }

            .num-key {
                width: 66px;
                height: 66px;
                background: #161719;
                border: 1px solid #333;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                color: #fff;
                cursor: pointer;
            }

            .num-key:active {
                background: #25282c;
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                75% { transform: translateX(8px); }
            }

            /* ----------------------------------
               [화면 3] 갤럭시 홈 화면 (대기소)
        ----------------------------------- */
            #home-screen {
                background-color: #121315;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .fallback-box {
                text-align: center;
                background: #161719;
                border: 1px solid #333;
                padding: 24px;
                border-radius: 20px;
                color: #fff;
            }

            /* ----------------------------------
               [화면 4] 카카오톡 채팅방 구역
        ----------------------------------- */
            #talk-screen {
                background-color: #1a1a1a;
                padding-top: 38px;
                color: #fff;
            }

            .talk-header {
                height: 50px;
                display: flex;
                align-items: center;
                padding: 0 16px;
                border-bottom: 1px solid #2d2d2d;
            }

            .back-btn { margin-right: 15px; cursor: pointer; font-size: 18px; }

            .chat-area {
                flex: 1;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .msg-bubble {
