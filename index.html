<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        /* 갤럭시 스타일 스마트폰 프레임 (반응형 외곽 틀) */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            background-color: #000000; /* 아무 무늬 없는 검정 배경 */
            position: relative;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 450px) {
            .phone-frame {
                border: none;
                border-radius: 0;
                max-height: 100vh;
            }
        }

        /* 상단 상태 바 (배터리 및 시간 표시 영역) */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 배터리 아이콘 모양 시각화 */
        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid #ffffff;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
        }

        .battery-level {
            width: 81%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 1px;
        }

        .battery-tip {
            width: 2px;
            height: 4px;
            background-color: #ffffff;
            position: absolute;
            right: -3px;
            border-radius: 0 1px 1px 0;
        }

        /* 중앙 시계 및 날짜 영역 */
        .lock-screen-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            z-index: 10;
        }

        .time {
            font-size: 64px;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .date {
            font-size: 16px;
            font-weight: 400;
            color: #e0e0e0;
            margin-bottom: 24px;
        }

        /* 카카오톡 알림 미리보기 창 */
        .notification-card {
            width: 90%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .kakao-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
        }

        .notification-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .noti-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
        }

        .noti-time {
            font-size: 12px;
            color: #cccccc;
        }

        .noti-text {
            font-size: 14px;
            color: #e5e5e5;
        }

        /* 하단 잠금해제 안내 및 숏컷 아이콘 영역 */
        .lock-screen-bottom {
            padding-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .unlock-text {
            font-size: 15px;
            color: #e0e0e0;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .bottom-action-bar {
            width: 100%;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 제공된 사진 속 반투명 원형 아이콘 스타일 적용 */
        .action-button {
            width: 56px;
            height: 56px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-button:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        /* SVG 아이콘 스타일 */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- 휴대폰 본체 프레임 -->
    <div class="phone-frame">
        
        <!-- 상단 바 -->
        <div class="status-bar">
            <div class="status-left">오후 5:02</div>
            <div class="status-right">
                <span>81%</span>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                    <div class="battery-tip"></div>
                </div>
            </div>
        </div>

        <!-- 중앙 화면 영역 (시계, 날짜, 알림) -->
        <div class="lock-screen-center">
            <div class="time">5:02</div>
            <div class="date">10월 6일 화요일</div>
            
            <!-- 카카오톡 알림 미리보기 창 -->
            <div class="notification-card">
                <img class="kakao-icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDAg2IYnAdytH10MKmi6wsnn-UPwxjORKPyCsJ1ONzpQ&s=10" alt="카카오톡">
                <div class="notification-content">
                    <div class="noti-header">
                        <span class="sender-name">덩이❤</span>
                        <span class="noti-time">지금</span>
                    </div>
                    <div class="noti-text">형 나 수업끝났어</div>
                </div>
            </div>
        </div>

        <!-- 하단 영역 (안내 문구, 양쪽 아이콘) -->
        <div class="lock-screen-bottom">
            <div class="unlock-text">화면을 탭하여 잠금해제</div>
            
            <div class="bottom-action-bar">
                <!-- 왼쪽 전화 아이콘 (사진 참고) -->
                <div class="action-button" aria-label="전화기">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </div>
                
                <!-- 오른쪽 카메라 아이콘 (사진 참고) -->
                <div class="action-button" aria-label="카메라">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
