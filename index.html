<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        /* [기본 스타일 구조] 단일 휴대폰 틀 유지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eaeaea;
            color: #ffffff;
        }

        /* 📱 유일한 휴대폰 본체 프레임 (절대 늘어나거나 새로 생기지 않음) */
        .phone-frame {
            width: 100%;
            max-width: 375px;
            height: 100vh;
            max-height: 812px;
            background-color: #000000; /* 무늬 없는 검정 */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 450px) {
            .phone-frame {
                border: 12px solid #222222;
                border-radius: 40px;
                height: 812px;
            }
        }

        /* 상단 고정 상태바 */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 100; /* 모든 화면보다 위에 고정 */
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 🔄 휴대폰 내부 화면들 (기본적으로 숨겨져 있다가 .active만 노출) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding-top: 40px; /* 상태바 공간 확보 */
            padding-bottom: 25px; /* 하단 인디케이터 공간 확보 */
        }
        
        .screen.active {
            display: flex;
        }

        /* 1️⃣ [화면] 잠금화면 구역 */
        #lock-screen {
            justify-content: space-between;
            align-items: center;
            padding-left: 24px;
            padding-right: 24px;
            cursor: pointer;
            z-index: 10;
        }

        .clock-area {
            text-align: center;
            margin-top: 30px;
        }

        .clock-time {
            font-size: 56px;
            font-weight: 300;
            line-height: 1.1;
        }

        .clock-date {
            font-size: 16px;
            font-weight: 400;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* 카카오톡 알림 미리보기 창 */
        .notification-card {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }

        .kakaotalk-icon-img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-name {
            font-size: 12px;
            color: #e0e0e0;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
        }

        .message-text {
            font-size: 14px;
            color: #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 잠금화면 하단 (보내주신 사진 참고 스타일) */
        .lock-bottom-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bottom-prompt {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            flex: 1;
        }

        .bottom-shortcut {
            width: 46px;
            height: 46px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .bottom-shortcut svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }


        /* 2️⃣ [화면] PIN 번호 입력 화면 */
        #pin-screen {
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .pin-prompt {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 25px;
        }

        .pin-dots-container {
            display: flex;
            gap: 16px;
            margin-bottom: 50px;
            height: 12px;
        }

        .pin-dot {
            width: 12px;
            height: 12px;
            border: 1.5px solid #ffffff;
            border-radius: 50%;
        }

        .pin-dot.filled {
            background-color: #ffffff;
        }

        /* 숫자 패드 그리드 */
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 260px;
        }

        .pin-btn {
            width: 70px;
            height: 70px;
            background: transparent;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .pin-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .pin-btn.text-btn {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }


        /* 3️⃣ [화면] 잠금해제 성공 시 홈 화면 */
        #home-screen {
            background-color: #121212;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }


        /* 4️⃣ [화면] 알림 누르고 해제 시 나타날 카톡 대화방 */
        #chat-screen {
            background-color: #abc1d1; /* 카톡 기본 배경색 */
            color: #000000;
            z-index: 60;
        }

        .chat-header {
            height: 50px;
            background-color: #abc1d1;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
        }

        .chat-user-name {
            font-size: 12px;
            color: #555555;
            margin-left: 2px;
        }

        .chat-bubble {
            background-color: #ffffff;
            padding: 10px 14px;
            border-radius: 0 12px 12px 12px;
            max-width: 70%;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-top: 5px;
        }

        /* 하단 가상 홈 물리 바 */
        .bottom-bar {
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 200;
        }

        .home-indicator {
            width: 120px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 📱 단 하나의 휴대폰 프레임틀 고정 -->
    <div class="phone-frame">
        
        <!-- 상단바 고정 (오후 5시 2분, 배터리 81%) -->
        <div class="status-bar">
            <span class="status-time">5:02</span>
            <div class="status-right">
                <span>📶</span>
                <span class="battery-text">81%</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 1️⃣ [화면 섹션] 잠금 화면 (초기 활성화) -->
        <div id="lock-screen" class="screen active" onclick="openPinPad('home')">
            <div class="clock-area">
                <div class="clock-time">5:02</div>
                <div class="clock-date">10월 6일 화요일</div>
            </div>

            <!-- 카카오톡 알림 레이아웃 -->
            <div class="notification-card" id="kakaoNotification">
                <img class="kakaotalk-icon-img" src="https://gstatic.com" alt="KakaoTalk">
                <div class="notification-content">
                    <div class="notification-header">
                        <span class="sender-name">덩이❤</span>
                        <span class="app-name">지금</span>
                    </div>
                    <div class="message-text">형 나 수업끝났어</div>
                </div>
            </div>

            <!-- 하단 구조 (전화기 - 문구 - 카메라) -->
            <div class="lock-bottom-area">
                <div class="bottom-shortcut">
