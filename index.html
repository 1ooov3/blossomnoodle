<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰 잠금화면 및 카카오톡 연동</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }
        /* 갤럭시 스타일 스마트폰 프레임 (반응형 외곽 틀) */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 740px; /* 요구사항에 따라 세로 길이만 기존 892px에서 740px로 수정 */
            background-color: #000000; /* 아무 무늬 없는 검정 배경 */
            position: relative;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        @media (max-width: 450px) {
            .phone-frame {
                border: none;
                border-radius: 0;
                max-height: 100vh;
            }
        }
        /* 상단 상태 바 (배터리 및 시간 표시 영역) */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            z-index: 50; /* 모든 레이어 위 고정 */
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* 배터리 아이콘 모양 시각화 */
        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid #ffffff;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
        }
        .battery-level {
            width: 81%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 1px;
        }
        .battery-tip {
            width: 2px;
            height: 4px;
            background-color: #ffffff;
            position: absolute;
            right: -3px;
            border-radius: 0 1px 1px 0;
        }
        /* 중앙 시계 및 날짜 영역 */
        .lock-screen-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            z-index: 10;
        }
        .time {
            font-size: 64px;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        .date {
            font-size: 16px;
            font-weight: 400;
            color: #e0e0e0;
            margin-bottom: 24px;
        }
        /* 카카오톡 알림 미리보기 창 */
        .notification-card {
            width: 90%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        .kakao-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
        }
        .notification-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .noti-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sender-name {
            font-size: 15px;
            font-weight: 600;
        }
        .noti-time {
            font-size: 12px;
            color: #cccccc;
        }
        .noti-text {
            font-size: 14px;
            color: #e5e5e5;
        }
        /* 하단 잠금해제 안내 및 숏컷 아이콘 영역 */
        .lock-screen-bottom {
            padding-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .unlock-text {
            font-size: 15px;
            color: #e0e0e0;
            font-weight: 400;
            letter-spacing: -0.5px;
        }
        .bottom-action-bar {
            width: 100%;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        /* 반투명 원형 아이콘 스타일 적용 */
        .action-button {
            width: 56px;
            height: 56px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-button:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }
        /* SVG 아이콘 스타일 */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 1. 디자인 보존 및 모션 전환용 추가 스타일 */
        .phone-frame { position: relative; overflow: hidden; }
        
        /* 기존 배치 요소를 잠금화면 레이어로 동적 정의 */
        .lock-layer-active {
            position: absolute; top: 40px; left: 0; width: 100%; height: calc(100% - 40px);
            display: flex; flex-direction: column; cursor: pointer; z-index: 10;
            transition: opacity 0.25s ease;
        }
        .lock-layer-active.fade-out { opacity: 0; pointer-events: none; }

        /* 비밀번호(PIN) 입력 레이어 - 화면 중앙 배치 시스템 적용 */
        .pin-layer {
            position: absolute; top: 40px; left: 0; width: 100%; height: calc(100% - 40px);
            background-color: #000000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding-bottom: 20px;
            opacity: 0; pointer-events: none; transform: translateY(30px);
            transition: opacity 0.25s ease, transform 0.3s ease; z-index: 20;
            gap: 30px; /* 문구와 키패드 간의 거리를 가깝게 좁히는 핵심 축 */
        }
        .pin-layer.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        /* 핀번호 문구 영역 위치 세정밀 조정 */
        .p-header { text-align: center; margin-top: 0; }
        .p-title { font-size: 19px; font-weight: 400; margin-bottom: 20px; color: #ffffff; }
        .p-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
        .p-dot { width: 12px; height: 12px; border: 2px solid #ffffff; border-radius: 50%; transition: background 0.1s; }
        .p-dot.filled { background-color: #ffffff; }
        .p-error { font-size: 14px; color: #ff4d4d; height: 20px; opacity: 0; transition: opacity 0.2s; }
        
        /* 모바일 키패드 격자 배열 */
        .p-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 35px; width: 80%; max-width: 300px; }
        .p-key { background: none; border: none; color: #ffffff; font-size: 28px; height: 64px; display: flex; justify-content: center; align-items: center; cursor: pointer; outline: none; }
        .p-key:active { background-color: rgba(255, 255, 255, 0.1); border-radius: 50%; }
        .p-key.txt-btn { font-size: 14px; color: #cccccc; }

        /* 홈화면 레이어 */
        .home-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; opacity: 0; pointer-events: none; z-index: 30;
        }
        .home-layer.active { opacity: 1; pointer-events: auto; }

        /* 카카오톡 대화방 레이어 */
        .chat-layer {
            position: absolute; top: 40px; left: 0; width: 100%; height: calc(100% - 40px);
            background-color: #bacee0; display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; z-index: 40;
        }
        .chat-layer.active { opacity: 1; pointer-events: auto; }
        .c-header { background-color: #bacee0; padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 17px; color: #000000; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .c-back { font-size: 20px; cursor: pointer; }
        .c-area { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .c-date { align-self: center; background-color: rgba(0, 0, 0, 0.1); color: #ffffff; padding: 4px 12px; border-radius: 12px; font-size: 11px; }
        .c-row { display: flex; gap: 8px; color: #000000; }
        .c-prof { width: 40px; height: 40px; border-radius: 15px; object-fit: cover; }
        .c-body { display: flex; flex-direction: column; gap: 4px; }
        .c-name { font-size: 13px; color: #555555; font-weight: 500; }
        .c-wrap { display: flex; align-items: flex-end; gap: 6px; }
        .c-bubble { background-color: #ffffff; padding: 10px 12px; border-radius: 0 12px 12px 12px; font-size: 14.5px; max-width: 220px; line-height: 1.4; }
        .c-time { font-size: 10px; color: #666666; white-space: nowrap; }
    </style>
</head>
<body>
    <!-- 휴대폰 본체 프레임 -->
    <div class="phone-frame">
        
        <!-- 상단 바 -->
        <div class="status-bar">
            <div class="status-left">오후 5:02</div>
            <div class="status-right">
                <span>81%</span>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                    <div class="battery-tip"></div>
                </div>
