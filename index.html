<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        /* 갤럭시 스타일 스마트폰 프레임 (반응형 외곽 틀) */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            background-color: #000000; /* 아무 무늬 없는 검정 배경 */
            position: relative;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 450px) {
            .phone-frame {
                border: none;
                border-radius: 0;
                max-height: 100vh;
            }
        }

        /* 상단 상태 바 (배터리 및 시간 표시 영역) */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            z-index: 30; /* 화면 전환 시에도 상단바 유지 */
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 배터리 아이콘 모양 시각화 */
        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid #ffffff;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
        }

        .battery-level {
            width: 81%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 1px;
        }

        .battery-tip {
            width: 2px;
            height: 4px;
            background-color: #ffffff;
            position: absolute;
            right: -3px;
            border-radius: 0 1px 1px 0;
        }

        /* 공통 화면 레이어 스타일 */
        .screen-layer {
            position: absolute;
            top: 40px; /* 상태바 아래부터 시작 */
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            display: flex;
            flex-direction: column;
            background-color: #000000;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        /* 1. 잠금화면 메인 레이어 */
        #lock-screen-layer {
            z-index: 10;
            cursor: pointer;
        }

        .lock-screen-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .time {
            font-size: 64px;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .date {
            font-size: 16px;
            font-weight: 400;
            color: #e0e0e0;
            margin-bottom: 24px;
        }

        /* 카카오톡 알림 미리보기 창 */
        .notification-card {
            width: 90%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            z-index: 15;
        }

        .kakao-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
        }

        .notification-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .noti-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
        }

        .noti-time {
            font-size: 12px;
            color: #cccccc;
        }

        .noti-text {
            font-size: 14px;
            color: #e5e5e5;
        }

        /* 하단 잠금해제 안내 및 숏컷 아이콘 영역 */
        .lock-screen-bottom {
            padding-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .unlock-text {
            font-size: 15px;
            color: #e0e0e0;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .bottom-action-bar {
            width: 100%;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 제공된 사진 속 반투명 원형 아이콘 스타일 적용 */
        .action-button {
            width: 56px;
            height: 56px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-button:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        /* SVG 아이콘 스타일 */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 2. 비밀번호(PIN) 입력 레이어 */
        #pin-screen-layer {
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
            justify-content: space-between;
            padding: 60px 40px 40px 40px;
        }

        .pin-upper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .pin-msg {
            font-size: 18px;
            font-weight: 400;
            color: #ffffff;
            height: 24px;
            text-align: center;
        }

        .pin-msg.error {
            color: #ff4d4d;
            animation: shake 0.3s ease-in-out;
        }

        /* PIN 도트 표시기 */
        .pin-dots {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transition: background-color 0.1s ease;
        }

        .dot.filled {
            background-color: #ffffff;
        }

        /* 모바일 숫자 키패드 그리드 */
        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 30px;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        .key {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 26px;
            font-weight: 400;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 50%;
            user-select: none;
        }

        .key:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .key.sub-text {
            font-size: 14px;
            color: #aaaaaa;
        }

        /* 3. 스마트폰 홈 화면 레이어 */
        #home-screen-layer {
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
        }

        .home-content {
            text-align: center;
        }

        .home-icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            padding: 40px 24px;
        }

        .home-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #ffffff;
        }

        .app-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: #2b2b2b;
        }

        /* 4. 카카오톡 대화방 레이어 */
        #chat-screen-layer {
            z-index: 5;
            background-color: #abc1d1; /* 카카오톡 기본 대화방 배경색 */
            color: #000000;
        }

        .chat-header {
            height: 50px;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .chat-body {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble-received {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .chat-thumb {
            width: 36px;
            height: 36px;
            border-radius: 14px;
            object-fit: cover;
        }

        .chat-bubble-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-name {
            font-size: 12px;
            color: #555555;
        }

        .chat-text-wrapper {
            display: flex;
