<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eaeaea;
            color: #ffffff;
        }

        /* 갤럭시 스타일 스마트폰 프레임 */
        .phone-frame {
            width: 100%;
            max-width: 375px;
            height: 100vh;
            max-height: 812px;
            background-color: #000000; /* 무늬 없는 검정 배경 */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 450px) {
            .phone-frame {
                border: 12px solid #222222;
                border-radius: 40px;
                height: 812px;
            }
        }

        /* 상단 상태바 */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 잠금화면 메인 컨테이너 */
        .lock-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 70px 24px 40px 24px;
            position: relative;
        }

        /* 날짜 및 시간 영역 */
        .clock-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .clock-time {
            font-size: 56px;
            font-weight: 300;
            line-height: 1.1;
        }

        .clock-date {
            font-size: 16px;
            font-weight: 400;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* 카카오톡 알림 미리보기 창 */
        .notification-card {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .notification-card:active {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* 제공받은 이미지 주소를 사용하는 카카오톡 아이콘 객체 */
        .kakaotalk-icon-img {
            width: 42px;
            height: 42px;
            border-radius: 12px; /* 약간 둥근 네모 형태 유지 */
            object-fit: cover;
            flex-shrink: 0;
        }

        /* 알림 텍스트 콘텐츠 */
        .notification-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-name {
            font-size: 12px;
            color: #e0e0e0;
            font-weight: 400;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .message-text {
            font-size: 14px;
            color: #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 하단 바 구역 */
        .bottom-bar {
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .home-indicator {
            width: 120px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- 상단 상태바 (5시 2분, 배터리 81% 고정) -->
        <div class="status-bar">
            <span class="status-time">5:02</span>
            <div class="status-right">
                <span>📶</span>
                <span class="battery-text">81%</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 잠금화면 콘텐츠 메인 -->
        <div class="lock-screen" id="lockScreen">
            
            <!-- 날짜 및 시간 고정 설정 -->
            <div class="clock-area">
                <div class="clock-time">5:02</div>
                <div class="clock-date">10월 6일 화요일</div>
            </div>

            <!-- 카카오톡 알림 미리보기 창 -->
            <div class="notification-card" id="kakaoNotification">
                <!-- 원하시는 카톡 공식 이미지 주소 적용 -->
                <img class="kakaotalk-icon-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDAg2IYnAdytH10MKmi6wsnn-UPwxjORKPyCsJ1ONzpQ&s=10" alt="KakaoTalk">
                
                <!-- 알림 내용 -->
                <div class="notification-content">
                    <div class="notification-header">
                        <span class="sender-name">덩이❤</span>
                        <span class="app-name">지금</span>
                    </div>
                    <div class="message-text">형 나 수업끝났어</div>
                </div>
            </div>

        </div>

        <!-- 하단 영역 -->
        <div class="bottom-bar">
            <div class="home-indicator"></div>
        </div>
    </div>

    <script>
        document.getElementById('kakaoNotification').addEventListener('click', function() {
            console.log('카톡 알림 클릭됨');
        });
    </script>
</body>
</html>
