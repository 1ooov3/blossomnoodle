<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        /* 기본 스타일 및 화면 중앙 정렬 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 갤럭시 스타일 기기 프레임 */
        .phone-frame {
            width: 360px;
            height: 740px;
            background-color: #000;
            border: 12px solid #222;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 상단 카메라 홀 (펀치홀) */
        .punch-hole {
            width: 14px;
            height: 14px;
            background-color: #111;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
        }

        /* 상단 상태 바 */
        .status-bar {
            height: 30px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 13px;
            z-index: 900;
            margin-top: 5px;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 화면 공통 컨테이너 */
        .screen {
            flex: 1;
            position: relative;
            display: none;
            background-color: #000;
            color: #fff;
        }
        .screen.active {
            display: block;
        }

        /* 1. 잠금 화면 */
        #lock-screen {
            cursor: pointer;
        }
        .lock-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px 20px 20px;
        }
        .time-info {
            text-align: center;
        }
        .time-info .date {
            font-size: 16px;
            margin-bottom: 2px;
            font-weight: 400;
        }
        .time-info .time {
            font-size: 50px;
            font-weight: 300;
            line-height: 1;
        }
        /* 카톡 알림창 */
        .notification-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
        .noti-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 100%;
            border-radius: 15px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .noti-box:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .noti-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
        }
        .noti-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .noti-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 2px;
        }
        .noti-message {
            font-size: 13px;
            color: #e0e0e0;
        }
        /* 하단 바 (전화, 카메라, 문구) */
        .lock-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
        }
        .bottom-icon {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }
        .unlock-prompt {
            font-size: 13px;
            color: #ddd;
            animation: pulse 2s infinite;
        }

        /* 2. PIN 입력 화면 */
        #pin-screen {
            background-color: rgba(0, 0, 0, 0.95);
        }
        .pin-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 30px;
        }
        .pin-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .pin-msg {
            font-size: 16px;
            margin-bottom: 20px;
            color: #fff;
        }
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
        }
        .dot.active {
            background-color: #fff;
        }
        /* 숫자 키패드 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-items: center;
        }
        .key {
            width: 65px;
            height: 65px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: 500;
            cursor: pointer;
        }
        .key:active {
            background: rgba(255,255,255,0.3);
        }
        .key.empty {
            background: transparent;
            cursor: default;
        }

        /* 3. 홈 화면 */
        #home-screen {
            background-color: #000;
            padding: 20px;
        }
        .home-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #fff;
            cursor: pointer;
        }
        .app-icon img {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            object-fit: cover;
        }

        /* 4. 카카오톡 대화방 화면 */
        #chat-screen {
            background-color: #abc1d1;
            color: #000;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            background-color: #abc1d1;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .back-btn {
            cursor: pointer;
            font-size: 18px;
            padding-right: 5px;
        }
        .chat-body {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-date {
            align-self: center;
            background: rgba(0,0,0,0.1);
            color: #fff;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            margin-bottom: 10px;
        }
        .bubble-group {
            display: flex;
            gap: 8px;
        }
        .chat-profile {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            object-fit: cover;
        }
        .chat-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-name {
            font-size: 12px;
            color: #555;
        }
        .chat-bubble {
            background-color: #fff;
            padding: 8px 12px;
            border-radius: 0 12px 12px 12px;
            font-size: 14px;
            max-width: 220px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 애니메이션 효과 */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- 갤럭시 기기 외형 구현 -->
    <div class="phone-frame">
        <div class="punch-hole"></div>
        
        <!-- 상단 바 고정 상태 레이아웃 -->
        <div class="status-bar">
            <div class="status-left">KT</div>
            <div class="status-right">
                <span>81%</span>
                <!-- 배터리 모양 아이콘 대용 -->
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 5H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/></svg>
            </div>
        </div>

        <!-- [화면 1] 잠금화면 -->
        <div id="lock-screen" class="screen active" onclick="goToPinScreen(event)">
            <div class="lock-content">
                <div class="time-info">
                    <div class="date">10월 6일 화요일</div>
                    <div class="time">오후 5:02</div>
                    
                    <!-- 알림창 영역 -->
                    <div class="notification-container">
                        <div class="noti-box" id="kakao-noti" onclick="clickNoti(event)">
                            <img class="noti-icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDAg2IYnAdytH10MKmi6wsnn-UPwxjORKPyCsJ1ONzpQ&s=10" alt="카톡">
                            <div class="noti-text">
                                <div class="noti-title">덩이❤</div>
