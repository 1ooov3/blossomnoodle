<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤럭시 블랙 테마 스마트폰</title>
    <style>
        :root {
            /* 🎨 배경은 순수한 검정색, 메인 글씨는 완벽한 흰색으로 지정 */
            --phone-bg-color: #000000;
            --main-text-color: #ffffff;
            --sub-text-color: #aaaaaa;
            --border-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SamsungOne', 'Pretendard', -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121315;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--main-text-color);
        }

        /* [틀] 프리미엄 갤럭시 스타일 프레임 */
        .phone-frame {
            width: 380px;
            height: 820px;
            background-color: var(--phone-bg-color);
            border: 8px solid #2d3034;
            border-radius: 46px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 갤럭시 전면 펀치홀 카메라 */
        .punch-hole {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background-color: #111111;
            border-radius: 50%;
            z-index: 100;
        }

        /* 최상단 인디케이터 바 */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 38px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 0;
            font-size: 13px;
            font-weight: 500;
            z-index: 90;
            background: transparent;
            color: var(--main-text-color);
        }
        .status-bar .r {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .battery-icon {
            width: 22px;
            height: 11px;
            border: 1px solid var(--main-text-color);
            border-radius: 3px;
            position: relative;
            padding: 1px;
            margin-left: 2px;
        }
        .battery-level {
            width: 81%; /* 81% 고정 */
            height: 100%;
            background-color: var(--main-text-color);
            border-radius: 1px;
        }

        /* 화면 기본 규격 공통 처리 */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--phone-bg-color); /* 검정색 배경 고정 */
        }
        .screen.active {
            display: flex;
        }

        /* ----------------------------------
           [화면 1] 잠금화면 (Lock Screen)
        ----------------------------------- */
        #lock-screen {
            padding-top: 75px;
            align-items: center;
            cursor: pointer;
        }
        .clock-widget {
            text-align: center;
        }
        .time-text {
            font-size: 54px;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.5px;
            color: var(--main-text-color);
        }
        .date-text {
            font-size: 15px;
            font-weight: 400;
            color: var(--sub-text-color);
            margin-top: 5px;
        }

        /* 알림센터 스킨 */
        .noti-box {
            width: calc(100% - 36px);
            margin-top: 45px;
            z-index: 10;
        }
        .kakao-noti {
            background: #161719; /* 가독성을 위한 다크 그레이 톤 알림바 */
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .kako-icon-wrapper {
            width: 38px;
            height: 38px;
            background-color: #fef01b; /* 카톡 아이콘 고유색 유지 */
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #3a1d1d;
        }
        .noti-info {
            flex: 1;
        }
        .noti-sender {
            font-size: 14px;
            font-weight: 600;
            color: var(--main-text-color);
            margin-bottom: 2px;
        }
        .noti-msg {
            font-size: 13px;
            color: var(--sub-text-color);
        }

        /* 잠금화면 하단 요소 */
        .lock-footer {
            position: absolute;
            bottom: 65px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
        }
        .footer-app-btn {
            width: 44px;
            height: 44px;
            background: #161719;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--main-text-color);
        }
        .guide-text {
            font-size: 13px;
            color: var(--sub-text-color);
            font-weight: 400;
        }

        /* ----------------------------------
           [화면 2] PIN 암호 입력 화면
        ----------------------------------- */
        #pin-screen {
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .pin-container {
            text-align: center;
            margin-bottom: 35px;
        }
        .pin-instruction {
            font-size: 16px;
            color: var(--main-text-color);
            margin-bottom: 20px;
            height: 22px;
        }
        .indicator-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .indicator-dot {
            width: 12px;
            height: 12px;
            border: 2px solid var(--main-text-color);
            border-radius: 50%;
            transition: background 0.1s;
        }
        .indicator-dot.active {
            background-color: var(--main-text-color);
        }

        /* 다이얼 키패드 */
        .numeric-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px 24px;
            width: 250px;
        }
        .num-key {
            width: 66px;
            height: 66px;
            background: #161719;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--main-text-color);
            cursor: pointer;
        }
        .num-key:active {
            background: #25282c;
        }

        /* ----------------------------------
           [화면 3] 갤럭시 홈 화면
        ----------------------------------- */
        #home-screen {
            justify-content: center;
            align-items: center;
            color: var(--main-text-color);
        }
        .home-fallback-box {
            text-align: center;
            background: #161719;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            width: calc(100% - 40px);
            cursor: pointer;
        }
        .home-fallback-box h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .home-fallback-box p {
            font-size: 14px;
            color: var(--sub-text-color);
        }
    </style>
</head>
<body>

    <!-- 스마트폰 기기 프레임 -->
    <div class="phone-frame">
        <div class="punch-hole"></div>
        
        <!-- 상단 바 -->
        <div class="status-bar">
            <span>12:30</span>
            <div class="r">
                <span>5G</span>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- [화면 1] 잠금화면 -->
        <div class="screen active" id="lock-screen" onclick="goPinScreen()">
            <div class="clock-widget">
                <div class="time-text">12:30</div>
                <div class="date-text">10월 18일(일)</div>
            </div>

            <div class="noti-box">
                <div class="kakao-noti">
                    <div class="kako-icon-wrapper">톡</div>
                    <div class="noti-info">
                        <div class="noti-sender">휴대폰 엿보기</div>
                        <div class="noti-msg">새로운 메시지가 도착했습니다.</div>
                    </div>
                </div>
            </div>

            <div class="lock-footer">
                <div class="footer-app-btn">📞</div>
                <span class="guide-text">화면을 탭하여 잠금 해제</span>
                <div class="footer-app-btn">📷</div>
            </div>
        </div>

        <!-- [화면 2] 비밀번호 입력 화면 -->
        <div class="screen" id="pin-screen">
            <div class="pin-container">
                <div class="pin-instruction">PIN 번호를 입력하세요</div>
                <div class="indicator-dots">
                    <div class="indicator-dot" id="dot1"></div>
                    <div class="indicator-dot" id="dot2"></div>
                    <div class="indicator-dot" id="dot3"></div>
                    <div class="indicator-dot" id="dot4"></div>
                </div>
            </div>

            <div class="numeric-keypad">
