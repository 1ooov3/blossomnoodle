<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 갤럭시 스타일 기기 프레임 */
        .phone-frame {
            width: 360px;
            height: 740px;
            background-color: #000;
            border: 12px solid #222;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 상단 카메라 홀 (펀치홀) */
        .punch-hole {
            width: 14px;
            height: 14px;
            background-color: #111;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        /* 상단 상태 바 */
        .status-bar {
            height: 30px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 13px;
            z-index: 900;
            margin-top: 5px;
            background-color: #000;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 화면 공통 컨테이너 */
        .screen {
            flex: 1;
            position: relative;
            display: none;
            background-color: #000;
            color: #fff;
        }
        .screen.active {
            display: block;
        }

        /* 1. 잠금 화면 디자인 */
        #lock-screen {
            position: relative;
            height: 100%;
        }

        /* 중요: 화면 전체를 덮어 클릭을 감지하는 투명 베이스 레이어 */
        .lock-bg-clicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #000; /* 아무 무늬 없는 검정 배경 */
            cursor: pointer;
        }

        /* UI 콘텐츠 레이어 (알림창을 제외한 텍스트들은 클릭 무시하도록 설정) */
        .lock-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px 20px 20px;
            pointer-events: none; 
        }

        .time-info {
            text-align: center;
            margin-top: 20px;
        }
        .time-info .date {
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 400;
            color: #eee;
        }
        .time-info .time {
            font-size: 54px;
            font-weight: 300;
            line-height: 1;
            color: #fff;
        }
        
        /* 카톡 알림창 (가장 위에 배치하여 독립적 클릭 보장) */
        .notification-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            width: 100%;
            pointer-events: auto; /* 마우스 클릭 활성화 */
        }
        .noti-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: background 0.2s;
        }
        .noti-box:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .noti-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            object-fit: cover;
        }
        .noti-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }
        .noti-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 2px;
        }
        .noti-message {
            font-size: 13px;
            color: #e0e0e0;
        }
        
        /* 하단 바 (전화, 카메라, 문구) */
        .lock-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            width: 100%;
        }
        .bottom-icon {
            width: 46px;
            height: 46px;
            background: rgba(255,255,255,0.18);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .unlock-prompt {
            font-size: 13px;
            color: #ccc;
            animation: pulse 2s infinite;
        }

        /* 2. PIN 입력 화면 */
        #pin-screen {
            background-color: #000;
        }
        .pin-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 30px;
        }
        .pin-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .pin-msg {
            font-size: 17px;
            margin-bottom: 25px;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
        }
        .dot.active {
            background-color: #fff;
        }
        /* 숫자 키패드 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            justify-items: center;
            margin-bottom: 20px;
        }
        .key {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 400;
            cursor: pointer;
        }
        .key:active {
            background: rgba(255,255,255,0.25);
        }
        .key.empty {
            background: transparent;
            cursor: default;
        }

        /* 3. 홈 화면 */
        #home-screen {
            background-color: #000;
            padding: 20px;
        }
        .home-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #fff;
            cursor: pointer;
        }
        .app-icon img {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: cover;
        }

        /* 4. 카카오톡 대화방 화면 */
        #chat-screen {
            background-color: #abc1d1;
            color: #000;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            background-color: #abc1d1;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .back-btn {
            cursor: pointer;
            font-size: 18px;
            padding-right: 5px;
        }
        .chat-body {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-date {
            align-self: center;
            background: rgba(0,0,0,0.1);
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 10px;
        }
        .bubble-group {
            display: flex;
            gap: 8px;
        }
        .chat-profile {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            object-fit: cover;
        }
        .chat-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-name {
            font-size: 12px;
            color: #555;
        }
        .chat-bubble {
            background-color: #fff;
            padding: 8px 12px;
            border-radius: 0 12px 12px 12px;
            font-size: 14px;
            max-width: 220px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 가상 탭 안내 애니메이션 */
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- 기기 외형 외곽선 프레임 -->
    <div class="phone-frame">
        <div class="punch-hole"></div>
        
        <!-- 상단 고정 표시줄 -->
        <div class="status-bar">
            <div class="status-left">KT</div>
            <div class="status-right">
                <span>81%</span>
