<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        /* [스타일 초기화] 단일 프레임 유지 구조 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eaeaea;
            color: #ffffff;
        }

        /* 📱 유일한 갤럭시 스타일 스마트폰 프레임 (덮어써도 절대 옆에 새로 생기지 않음) */
        .phone-frame {
            width: 100%;
            max-width: 375px;
            height: 100vh;
            max-height: 812px;
            background-color: #000000; /* 아무 무늬 없는 검정 */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 450px) {
            .phone-frame {
                border: 12px solid #222222;
                border-radius: 40px;
                height: 812px;
            }
        }

        /* 상단 고정 상태바 (오후 5시 2분, 배터리 81% 상시 고정) */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 🔄 내부 화면 템플릿 (.active 클래스로 유기적 스위칭) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding-top: 40px; /* 상단바 레이어 침범 방지 */
            padding-bottom: 25px; /* 하단 홈인디케이터 구역 확보 */
        }
        
        .screen.active {
            display: flex;
        }

        /* 1️⃣ [화면] 맨 처음 잠금화면 구역 */
        #lock-screen {
            justify-content: space-between;
            align-items: center;
            padding-left: 24px;
            padding-right: 24px;
            cursor: pointer;
            z-index: 10;
        }

        .clock-area {
            text-align: center;
            margin-top: 30px;
        }

        .clock-time {
            font-size: 56px;
            font-weight: 300;
            line-height: 1.1;
        }

        .clock-date {
            font-size: 16px;
            font-weight: 400;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* 알림 미리보기 창 */
        .notification-card {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }

        /* 지정해주신 카카오톡 공식 이미지 적용 아이콘 */
        .kakaotalk-icon-img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-name {
            font-size: 12px;
            color: #e0e0e0;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
        }

        .message-text {
            font-size: 14px;
            color: #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 잠금화면 하단 (보내주신 참조 사진 완벽 싱크 구현) */
        .lock-bottom-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bottom-prompt {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            flex: 1;
            letter-spacing: -0.3px;
        }

        /* 왼쪽 전화기, 오른쪽 카메라 원형 숏컷 버튼 */
        .bottom-shortcut {
            width: 46px;
            height: 46px;
            background-color: rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .bottom-shortcut svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.8;
        }


        /* 2️⃣ [화면] 모바일 숫자 키패드 PIN 입력 화면 */
        #pin-screen {
            background-color: rgba(0, 0, 0, 0.96);
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .pin-prompt {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 25px;
            color: #ffffff;
        }

        /* 암호 동그라미 컨테이너 */
        .pin-dots-container {
            display: flex;
            gap: 16px;
            margin-bottom: 50px;
            height: 12px;
        }

        .pin-dot {
            width: 12px;
            height: 12px;
            border: 1.5px solid #ffffff;
            border-radius: 50%;
        }

        .pin-dot.filled {
            background-color: #ffffff;
        }

        /* 숫자 패드 그리드 배열 */
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 260px;
        }

        .pin-btn {
            width: 70px;
            height: 70px;
            background: transparent;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .pin-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .pin-btn.text-btn {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }


        /* 3️⃣ [화면] 잠금해제 성공 시 나타나는 빈 홈화면 */
        #home-screen {
            background-color: #000000; /* 아무 무늬 없는 검정 */
            justify-content: center;
            align-items: center;
            z-index: 50;
        }


        /* 4️⃣ [화면] 알림 터치 성공 시 바로 진입할 카톡 대화방 */
        #chat-screen {
            background-color: #abc1d1; /* 카카오톡 시그니처 배경색 */
            color: #000000;
            z-index: 60;
        }

        .chat-header {
            height: 50px;
            background-color: #abc1d1;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
        }

        .chat-user-name {
            font-size: 12px;
            color: #555555;
            margin-left: 2px;
        }

        .chat-bubble {
            background-color: #ffffff;
            padding: 10px 14px;
            border-radius: 0 12px 12px 12px;
            max-width: 70%;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-top: 5px;
        }

        /* 하단 가상 네비게이션 소프트 바 */
        .bottom-bar {
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 200;
        }

        .home-indicator {
            width: 120px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 📱 단 하나의 휴대폰 고정 프레임 구조 -->
    <div class="phone-frame">
        
        <!-- 상단 고정 상태바 영역 -->
        <div class="status-bar">
            <span class="status-time">5:02</span>
            <div class="status-right">
                <span>📶</span>
                <span class="battery-text">81%</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 1️⃣ [화면] 잠금 화면 (마우스 클릭 시 PIN 번호 입력창 전환) -->
        <div id="lock-screen" class="screen active" onclick="openPinPad('home')">
            
            <div class="clock-area">
                <div class="clock-time">5:02</div>
                <div class="clock-date">10월 6일 화요일</div>
            </div>

            <!-- 카카오톡 알림 미리보기 레이아웃 -->
            <div class="notification-card" id="kakaoNotification">
                <img class="kakaotalk-icon-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDAg2IYnAdytH10MKmi6wsnn-UPwxjORKPyCsJ1ONzpQ&s=10" alt="KakaoTalk">
                <div class="notification-content">
                    <div class="notification-header">
                        <span class="sender-name">덩이❤</span>
                        <span class="app-name">지금</span>
                    </div>
                    <div class="message-text">형 나 수업끝났어</div>
