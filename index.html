<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eaeaea;
            color: #ffffff;
        }

        /* 📱 단 하나의 갤럭시 스타일 스마트폰 프레임 */
        .phone-frame {
            width: 100%;
            max-width: 375px;
            height: 100vh;
            max-height: 812px;
            background-color: #000000; /* 아무 무늬 없는 검정 */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 450px) {
            .phone-frame {
                border: 12px solid #222222;
                border-radius: 40px;
                height: 812px;
            }
        }

        /* 상단 고정 상태바 (오후 5시 2분, 배터리 81% 상시 고정) */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 내부 화면 공통 구조 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding-top: 40px; /* 상단바 영역 */
            padding-bottom: 25px; /* 하단 바 영역 */
        }
        
        .screen.active {
            display: flex;
        }

        /* 1️⃣ [화면] 정확한 초기 레이아웃 복원 잠금화면 */
        #lock-screen {
            height: 100%;
            padding-left: 24px;
            padding-right: 24px;
            cursor: pointer;
            z-index: 10;
            display: none; /* 기본 숨김, active 시 flex */
        }
        #lock-screen.active {
            display: flex;
            flex-direction: column;
        }

        /* 날짜 및 시간 영역 */
        .clock-area {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px; /* 카톡 알림이 바로 아래에 붙도록 여백 조절 */
        }

        .clock-time {
            font-size: 56px;
            font-weight: 300;
            line-height: 1.1;
        }

        .clock-date {
            font-size: 16px;
            font-weight: 400;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* 카카오톡 알림 미리보기 창 (시간/날짜 바로 아래 배치) */
        .notification-card {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 20; /* 클릭 확실하게 먹히도록 높임 */
        }

        /* 카카오톡 공식 이미지 적용 아이콘 */
        .kakaotalk-icon-img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-name {
            font-size: 12px;
            color: #e0e0e0;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
        }

        .message-text {
            font-size: 14px;
            color: #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 잠금화면 하단 정렬 구역 (보내주신 사진 완벽 구현) */
        .lock-bottom-container {
            margin-top: auto; /* 중간 여백을 다 밀어내고 맨 아래로 강제 고정 */
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
        }

        .bottom-prompt {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            flex: 1;
            letter-spacing: -0.3px;
        }

        /* 왼쪽 전화기, 오른쪽 카메라 원형 아이콘 */
        .bottom-shortcut {
            width: 46px;
            height: 46px;
            background-color: rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .bottom-shortcut svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.8;
        }


        /* 2️⃣ [화면] PIN 번호 입력창 화면 */
        #pin-screen {
            background-color: rgba(0, 0, 0, 0.96);
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .pin-prompt {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 25px;
        }

        .pin-dots-container {
            display: flex;
            gap: 16px;
            margin-bottom: 50px;
            height: 12px;
        }

        .pin-dot {
            width: 12px;
            height: 12px;
            border: 1.5px solid #ffffff;
            border-radius: 50%;
        }

        .pin-dot.filled {
            background-color: #ffffff;
        }

        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 260px;
        }

        .pin-btn {
            width: 70px;
            height: 70px;
            background: transparent;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .pin-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .pin-btn.text-btn {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }


        /* 3️⃣ [화면] 성공 시 나타나는 검정 홈화면 */
        #home-screen {
            background-color: #000000;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }


        /* 4️⃣ [화면] 카톡방 화면 */
        #chat-screen {
            background-color: #abc1d1;
            color: #000000;
            z-index: 60;
        }

        .chat-header {
            height: 50px;
            background-color: #abc1d1;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
        }

        .chat-user-name {
            font-size: 12px;
            color: #555555;
            margin-left: 2px;
        }

        .chat-bubble {
            background-color: #ffffff;
            padding: 10px 14px;
            border-radius: 0 12px 12px 12px;
            max-width: 70%;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-top: 5px;
        }

        /* 하단 소프트 바 물리 바 */
        .bottom-bar {
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 200;
        }

        .home-indicator {
            width: 120px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- 상단 고정 상태바 구역 -->
        <div class="status-bar">
            <span class="status-time">5:02</span>
            <div class="status-right">
                <span>📶</span>
                <span class="battery-text">81%</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 1️⃣ [화면] 아까의 정확한 정렬 구조 복원 잠금화면 (전체 클릭 인식 보정) -->
        <div id="lock-screen" class="screen active" onclick="openPinPad('home')">
            
            <!-- 시간 및 날짜 -->
            <div class="clock-area">
                <div class="clock-time">5:02</div>
                <div class="clock-date">10월 6일 화요일</div>
            </div>

            <!-- 카카오톡 알림 미리보기 (정확하게 날짜 바로 밑에 위치) -->
            <div class="notification-card" id="kakaoNotification">
                <img class="kakaotalk-icon-img" src="https://gstatic.com" alt="KakaoTalk">
                <div class="notification-content">
                    <div class="notification-header">
                        <span class="sender-name">덩이❤</span>
