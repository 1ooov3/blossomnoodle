<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰 캘린더</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            -webkit-user-select: none;
            user-select: none;
        } 
        body { 
            background-color: #1a1a1a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #222222; 
            overflow: hidden; 
        } 
        /* 갤럭시 스타일 스마트폰 프레임 */ 
        .phone-frame { 
            width: 100%; 
            max-width: 412px; 
            height: 720px; 
            background-color: #ffffff; 
            position: relative; 
            border-radius: 40px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 12px solid #2d2d2d; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        @media (max-width: 450px) { 
            .phone-frame { 
                border: none; 
                border-radius: 0; 
                height: 90dvh; 
                max-height: 90dvh; 
            } 
        } 
        /* 상단 상태 바 (오후 5:02 고정) */ 
        .status-bar { 
            height: 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 24px; 
            font-size: 14px; 
            font-weight: 500; 
            z-index: 10; 
            background-color: #ffffff;
            color: #000000;
        } 
        .status-right { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        } 
        .battery-icon { 
            width: 22px; 
            height: 12px; 
            border: 1px solid #000000; 
            border-radius: 3px; 
            position: relative; 
            display: flex; 
            align-items: center; 
            padding: 1px; 
        } 
        .battery-level { 
            width: 81%; /* 81퍼센트 시각화 고정 */
            height: 100%; 
            background-color: #000000; 
            border-radius: 1px; 
        } 
        .battery-tip { 
            width: 2px; 
            height: 4px; 
            background-color: #000000; 
            position: absolute; 
            right: -3px; 
            border-radius: 0 1px 1px 0; 
        }
        /* 캘린더 헤더 영역 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #ffffff;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            text-decoration: none;
            color: #000000;
            display: flex;
            align-items: center;
        }
        .current-month {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .icon-btn {
            font-size: 20px;
            color: #000000;
            font-weight: bold;
        }
        .today-icon {
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 1px 4px;
            font-size: 11px;
            font-weight: bold;
        }
        /* 요일 헤더 */
        .weekdays-row {
            display: flex;
            background-color: #ffffff;
            padding: 15px 0 5px 0;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }
        .week-number-space {
            width: 40px;
            flex-shrink: 0;
        }
        .weekdays-days {
            display: flex;
            flex-grow: 1;
        }
        .weekday {
            flex: 1;
        }
        .weekday.sun { color: #d9383a; }
        .weekday.sat { color: #4a90e2; }
        .weekday.normal { color: #666666; }
        /* 달력 본문 스크롤 영역 */
        .calendar-body-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
        }
        .calendar-grid {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
        }
        /* 주단위 행(Row) 구조 */
        .calendar-row {
            display: flex;
            flex: 1;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
        }
        .week-number {
            width: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8px;
            font-size: 12px;
            color: #999999;
        }
        
        /* 날짜 및 일정을 겹쳐서 배치하기 위한 그리드 */
        .row-grid-content {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto 1fr; /* 1층: 날짜 숫자, 2층: 일정 막대들 */
            position: relative;
        }
        /* 개별 날짜 칸의 기본 배경 세로선 조절 */
        .day-bg-cell {
            grid-row: 1 / span 2;
            border-right: 1px solid #fbfbfb;
            position: relative;
        }
        .day-bg-cell:last-child {
            border-right: none;
        }
        /* 날짜 숫자 표시 구역 */
        .day-number-wrapper {
            grid-row: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 4px;
            height: 34px;
            justify-content: center;
            z-index: 2;
        }
        .day-num {
            font-size: 14px;
            font-weight: 500;
            color: #333333;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .day-number-wrapper.today .day-num {
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            font-weight: bold;
        }
        .lunar-date {
            font-size: 10px;
            color: #b5b5b5;
            margin-top: -2px;
        }
        .day-number-wrapper.sun .day-num, .day-number-wrapper.holiday .day-num { color: #d9383a; }
        .day-number-wrapper.sat .day-num { color: #4a90e2; }
        .day-number-wrapper.other-month { opacity: 0.25; }
        /* 일정 배치 레이어 */
        .row-events-layer {
            grid-row: 2;
            grid-column: 1 / span 7;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 2px 2px 4px 2px;
            position: relative;
        }
        /* 일정 전체를 감싸는 주 단위 그리드 배치용 시스템 */
        .events-grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            width: 100%;
        }
        /* ★ 일정 막대 스타일 변경 (글자 안 잘리도록 수정) ★ */
        .event-bar {
            font-size: 10px;
            padding: 3px 4px;
            color: white;
            border-radius: 3px;
            text-align: center;
            font-weight: 500;
            
            /* 핵심 수정: 한 줄 공간 부족 시 두 줄 이상으로 줄바꿈 */
            white-space: normal; 
            word-break: break-all; 
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 16px;
        }
        
        /* 테마별 일정 색상 */
        .event-pink { background-color: #ff8fa3; }
        .event-red { background-color: #f25c5c; }
        .event-blue { background-color: #4ea8de; }
        .event-mint { background-color: #72efdd; color: #222222; }
        /* 하단 푸터 */
        .calendar-footer {
            height: 70px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-top: 1px solid #f0f0f0;
        }
        .footer-info-tag {
            position: absolute;
            left: 24px;
            background-color: #f5f5f5;
            color: #666666;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
        .add-btn {
            position: absolute;
            right: 24px;
            width: 44px;
            height: 44px;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #333333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 상단 상태 바 (오후 5:02 고정 및 배터리 81% 세팅) -->
        <div class="status-bar">
            <div class="status-left">오후 5:02</div>
            <div class="status-right">
                <span>📶</span>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                    <div class="battery-tip"></div>
                </div>
            </div>
        </div>
    <!-- 캘린더 상단 헤더 -->
        <div class="calendar-header">
            <div class="header-left">
                <a href="home.html" class="menu-btn">≡</a>
                <div class="current-month" id="calendar-month-txt">10월</div>
            </div>
            <div class="header-right">
                <span class="icon-btn">🔍</span>
                <span class="icon-btn today-icon">19</span>
            </div>
        </div>
        <!-- 요일 표시줄 -->
        <div class="weekdays-row">
            <div class="week-number-space"></div>
            <div class="weekdays-days">
                <div class="weekday sun">일</div>
                <div class="weekday normal">월</div>
                <div class="weekday normal">화</div>
                <div class="weekday normal">수</div>
                <div class="weekday normal">목</div>
                <div class="weekday normal">금</div>
                <div class="weekday sat">토</div>
            </div>
        </div>
        <!-- 달력 메인 그리드 바디 -->
        <div class="calendar-body-container" id="swipe-area">
            <div class="calendar-grid" id="calendar-grid-box"></div>
        </div>
        <!-- 하단 정보 및 추가 바 -->
        <div class="calendar-footer">
            <div class="footer-info-tag">10월 6일에 추가</div>
            <div class="add-btn">+</div>
        </div>
    </div>
    <script>
        let currentYear = 2026;
        let currentMonth = 9; // 10월 기본값 고정 (0부터 시작)
        // 음력 일자 및 공휴일 텍스트 데이터셋 명시
        const dayMetadata = {
            "2026-10-03": { isHoliday: true, holidayName: "개천절" },
            "2026-10-05": { holidayName: "대체공휴일" },
            "2026-10-09": { isHoliday: true, holidayName: "한글날" },
            "2026-09-27": { lunar: "8.17" },
            "2026-10-04": { lunar: "8.24" },
            "2026-10-06": { lunar: "8.26" },
            "2026-10-11": { lunar: "9.1" },
            "2026-10-18": { lunar: "9.8" },
            "2026-10-25": { lunar: "9.15" }
        };
        // 요청하신 2026년 10월 지정 스케줄 데이터 목록
        const fixedEvents = [
            { start: "2026-10-04", end: "2026-10-05", text: "덩이랑 부산 여행", color: "event-pink" },
            { start: "2026-10-08", end: "2026-10-08", text: "7주년 ♥", color: "event-pink" },
            { start: "2026-10-10", end: "2026-10-10", text: "데이트", color: "event-pink" },
            { start: "2026-10-13", end: "2026-10-13", text: "김교수님 면담", color: "event-blue" },
            { start: "2026-10-14", end: "2026-10-14", text: "심사용 논문 초안 제출", color: "event-blue" },
            { start: "2026-10-16", end: "2026-10-16", text: "신청 마감일", color: "event-mint" },
            { start: "2026-10-19", end: "2026-10-19", text: "구구타 정기 결제", color: "event-blue" },
            { start: "2026-10-21", end: "2026-10-27", text: "성민이 중간고사", color: "event-red" },
            { start: "2026-10-30", end: "2026-10-30", text: "데이트", color: "event-pink" }
        ];
        // 캘린더 전용 주차 계산 연산 함수
        function getWeekOfYear(date) {
            const target = new Date(date.valueOf());
            const dayNr = (date.getDay() + 6) % 7;
            target.setDate(target.getDate() - dayNr + 3);
            const firstThursday = target.valueOf();
            target.setMonth(0, 1);
            if (target.getDay() !== 4) {
                target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
            }
            return 1 + Math.ceil((firstThursday - target) / 604800000);
        }
        // 달력 내부 날짜판 및 연속 일정 바 동적 빌드 함수
        function renderCalendar(year, month) {
            document.getElementById("calendar-month-txt").innerText = `${month + 1}월`;
            const gridBox = document.getElementById("calendar-grid-box");
            gridBox.innerHTML = "";
            const firstDayOfMonth = new Date(year, month, 1);
            const startOffset = firstDayOfMonth.getDay();
            const startDate = new Date(year, month, 1 - startOffset);
            for (let w = 0; w < 5; w++) {
                const rowObj = document.createElement("div");
                rowObj.className = "calendar-row";
                const currentWeekDate = new Date(startDate);
                currentWeekDate.setDate(startDate.getDate() + w * 7);
                const weekNumText = getWeekOfYear(currentWeekDate);
                // 주차 수치 엘리먼트 배치
                const weekNumDiv = document.createElement("div");
                weekNumDiv.className = "week-number";
                weekNumDiv.innerText = weekNumText;
                rowObj.appendChild(weekNumDiv);
                // 주단위 그리드 내부 레이아웃 컨텐츠 박스 생성
                const rowGridContent = document.createElement("div");
                rowGridContent.className = "row-grid-content";
                let weekDates = [];
                for (let d = 0; d < 7; d++) {
                    const thisDate = new Date(startDate);
                    thisDate.setDate(startDate.getDate() + (w * 7 + d));
                    weekDates.push(thisDate);
                    const dateStr = `${thisDate.getFullYear()}-${String(thisDate.getMonth()+1).padStart(2,'0')}-${String(thisDate.getDate()).padStart(2,'0')}`;
                    // 칸별 세로 구분선 배경 렌더링
                    const bgCell = document.createElement("div");
                    bgCell.className = "day-bg-cell";
                    bgCell.style.gridColumn = `${d + 1}`;
                    rowGridContent.appendChild(bgCell);
                    // 1층 날짜 래퍼 디비전 설정
                    const numWrapper = document.createElement("div");
                    numWrapper.className = "day-number-wrapper";
                    numWrapper.style.gridColumn = `${d + 1}`;
                    if (d === 0) numWrapper.classList.add("sun");
                    if (d === 6) numWrapper.classList.add("sat");
                    if (thisDate.getMonth() !== month) numWrapper.classList.add("other-month");
                    if (thisDate.getFullYear() === 2026 && thisDate.getMonth() === 9 && thisDate.getDate() === 19) {
                        numWrapper.classList.add("today");
                    }
                    const dayNum = document.createElement("div");
                    dayNum.className = "day-num";
                    dayNum.innerText = thisDate.getDate();
                    numWrapper.appendChild(dayNum);
                    if (dayMetadata[dateStr]) {
                        const meta = dayMetadata[dateStr];
                        if (meta.isHoliday) numWrapper.classList.add("holiday");
                        if (meta.holidayName || meta.lunar) {
                            const infoLabel = document.createElement("div");
                            infoLabel.className = "lunar-date";
                            infoLabel.innerText = meta.holidayName || meta.lunar;
                            numWrapper.appendChild(infoLabel);
                        }
                    }
                    rowGridContent.appendChild(numWrapper);
                }
                // 2층 일정 배치용 단독 레이어 트랙 설정
                const eventsLayer = document.createElement("div");
                eventsLayer.className = "row-events-layer";
                const eventsGridContainer = document.createElement("div");
                eventsGridContainer.className = "events-grid-container";
                // 해당 행(주차)의 시작일과 종료일 문자열 파싱 구하기
                const firstDateOfWeek = weekDates[0];
                const lastDateOfWeek = weekDates[6];
                
                const weekStartStr = `${firstDateOfWeek.getFullYear()}-${String(firstDateOfWeek.getMonth()+1).padStart(2,'0')}-${String(firstDateOfWeek.getDate()).padStart(2,'0')}`;
                const weekEndStr = `${lastDateOfWeek.getFullYear()}-${String(lastDateOfWeek.getMonth()+1).padStart(2,'0')}-${String(lastDateOfWeek.getDate()).padStart(2,'0')}`;
                fixedEvents.forEach(ev => {
                    if (ev.end >= weekStartStr && ev.start <= weekEndStr) {
                        
                        let startCol = 1;
                        if (ev.start > weekStartStr) {
                            const evStartDate = new Date(ev.start);
                            startCol = evStartDate.getDay() + 1;
                        }
                        let endCol = 8;
                        if (ev.end < weekEndStr) {
                            const evEndDate = new Date(ev.end);
                            endCol = evEndDate.getDay() + 2;
                        }
                        const evBar = document.createElement("div");
                        evBar.className = `event-bar ${ev.color}`;
                        evBar.style.gridColumn = `${startCol} / ${endCol}`;
                        evBar.innerText = ev.text;
                        eventsGridContainer.appendChild(evBar);
                    }
                });
                eventsLayer.appendChild(eventsGridContainer);
                rowGridContent.appendChild(eventsLayer);
                rowObj.appendChild(rowGridContent);
                gridBox.appendChild(rowObj);
            }
        }
        // 화면 터치 액션 및 드래그 바인딩 핸들러 구역
        const swipeArea = document.getElementById("swipe-area");
        let startX = 0; let startY = 0;
        swipeArea.addEventListener("touchstart", (e) => {
            startX = e.touches.clientX; startY = e.touches.clientY;
        }, { passive: true });
        swipeArea.addEventListener("touchend", (e) => {
            const diffX = e.changedTouches.clientX - startX;
            const diffY = e.changedTouches.clientY - startY;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                if (diffX > 0) {
                    currentMonth--;
                    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                } else {
                    currentMonth++;
                    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                }
                renderCalendar(currentYear, currentMonth); 
 // 화면 터치 액션 및 드래그 바인딩 핸들러 구역
        const swipeArea = document.getElementById("swipe-area");
        let startX = 0; 
        let startY = 0;
        // 모바일 기기 터치 시작 이벤트 바인딩
        swipeArea.addEventListener("touchstart", (e) => {
            startX = e.touches[0].clientX; 
            startY = e.touches[0].clientY;
        }, { passive: true });
        // 모바일 기기 터치 종료 이벤트 바인딩 (이전 달 / 다음 달 무한 이동 계산)
        swipeArea.addEventListener("touchend", (e) => {
            const diffX = e.changedTouches[0].clientX - startX;
            const diffY = e.changedTouches[0].clientY - startY;
            // 상하 스크롤 오작동 방지용 판정 (가로 입력이 더 클 때만 전환)
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                if (diffX > 0) {
                    // 오른쪽으로 드래그 시: 이전 달로 이동
                    currentMonth--;
                    if (currentMonth < 0) { 
                        currentMonth = 11; 
                        currentYear--; 
                    }
                } else {
                    // 왼쪽으로 드래그 시: 다음 달로 이동
                    currentMonth++;
                    if (currentMonth > 11) { 
                        currentMonth = 0; 
                        currentYear++; 
                    }
                }
                renderCalendar(currentYear, currentMonth);
            }
        }, { passive: true });
        // 데스크톱 PC 마우스 클릭 시작 이벤트 보완
        swipeArea.addEventListener("mousedown", (e) => { 
            startX = e.clientX; 
            startY = e.clientY; 
        });
        // 데스크톱 PC 마우스 뗐을 때 이벤트 보완
        swipeArea.addEventListener("mouseup", (e) => {
            const diffX = e.clientX - startX; 
            const diffY = e.clientY - startY;
            
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                if (diffX > 0) {
                    currentMonth--; 
                    if (currentMonth < 0) { 
                        currentMonth = 11; 
                        currentYear--; 
                    }
                } else {
                    currentMonth++; 
                    if (currentMonth > 11) { 
                        currentMonth = 0; 
                        currentYear++; 
                    }
                }
                renderCalendar(currentYear, currentMonth);
            }
        });
        // 초기 화면 인스턴스 출력 실행 (최초 실행 시 2026년 10월 기본 렌더링)
        renderCalendar(currentYear, currentMonth);
    </script>
</body>
</html>
